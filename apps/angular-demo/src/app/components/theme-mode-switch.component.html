<div class="mode-switch" role="group" aria-label="Theme mode">
	@for (option of options; track option.value) {
		<button
			type="button"
			class="mode-option"
			[class.active]="mode() === option.value"
			[disabled]="disabled() || mode() === option.value"
			(click)="select(option, $event)"
		>
			@switch (option.value) {
				@case ('system') {
					<app-icon-monitor [size]="16" />
				}
				@case ('light') {
					<app-icon-sun [size]="16" />
				}
				@case ('dark') {
					<app-icon-moon [size]="16" />
				}
				@case ('sepia') {
					<app-icon-droplet [size]="16" />
				}
			}
			{{ option.label }}
		</button>
	}
</div>
